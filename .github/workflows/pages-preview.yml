# Trusted default-branch workflow. PR builds have read-only contents permission;
# this job only publishes their static artifact and never checks out or executes PR code.
name: Pages preview

on:
  workflow_run:
    workflows: [Pull request checks]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Validate current PR and artifact
        id: plan
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { pathToFileURL } = await import("node:url");
            const { previewPlan, previewRemovalPlan } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/preview-plan.mjs`).href
            );
            const repo = context.repo;
            if (context.eventName === "pull_request_target") {
              const number = context.payload.pull_request.number;
              const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: number });
              const plan = await previewRemovalPlan(pr, async (path, ref) => {
                const { data } = await github.rest.repos.getContent({ ...repo, path, ref });
                return data;
              });
              if (!plan) {
                core.info("No published preview to remove (or the PR is not closed).");
                return;
              }
              core.setOutput("number", String(plan.number));
              core.setOutput("mode", "remove");
              return;
            }
            const run = context.payload.workflow_run;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...repo,
              run_id: run.id,
            });
            const candidates = artifacts.filter(
              (artifact) => /^preview-pr-[1-9][0-9]*$/.test(artifact.name) && !artifact.expired,
            );
            if (candidates.length !== 1) throw new Error("Expected exactly one preview artifact");
            const number = Number(candidates[0].name.slice("preview-pr-".length));
            const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: number });
            const plan = previewPlan(run, artifacts, pr);
            if (!plan) {
              core.info("Preview is stale or the PR is not open; skipping publish.");
              return;
            }
            core.setOutput("number", String(plan.number));
            core.setOutput("artifact", String(plan.artifactId));
            core.setOutput("mode", "deploy");

      - name: Download preview artifact
        if: steps.plan.outputs.mode == 'deploy'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ steps.plan.outputs.artifact }}
          merge-multiple: true
          path: preview-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Check static artifact
        if: steps.plan.outputs.mode == 'deploy'
        env:
          PR_NUMBER: ${{ steps.plan.outputs.number }}
        run: node scripts/verify-preview.mjs preview-site

      - name: Publish or remove preview
        if: steps.plan.outputs.mode != ''
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1
        with:
          source-dir: preview-site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pr-number: ${{ steps.plan.outputs.number }}
          action: ${{ steps.plan.outputs.mode }}
          comment: false
          deploy-commit-message: Deploy preview for PR ${{ steps.plan.outputs.number }}
          remove-commit-message: Remove preview for PR ${{ steps.plan.outputs.number }}

      - name: Comment with preview links
        if: steps.plan.outputs.mode == 'deploy'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: pr-preview
          number: ${{ steps.plan.outputs.number }}
          message: |
            pt-BR: https://id42studio.github.io/pr-preview/pr-${{ steps.plan.outputs.number }}/
            English: https://id42studio.github.io/pr-preview/pr-${{ steps.plan.outputs.number }}/en/

            A publicação fica disponível depois que o workflow [Pages deploy](https://github.com/ID42Studio/ID42Studio.github.io/actions/workflows/pages-deploy.yml) termina. Este comentário é atualizado a cada commit validado e a preview é removida quando o PR fecha.

      - name: Comment that the preview was removed
        if: steps.plan.outputs.mode == 'remove'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: pr-preview
          number: ${{ steps.plan.outputs.number }}
          message: Preview removida porque o PR foi fechado.
